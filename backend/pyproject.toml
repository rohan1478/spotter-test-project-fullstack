[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-aware-routing-backend"
version = "0.1.0"
description = "Django API for weather-aware route comparison"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2.8,<5.3",
  "djangorestframework>=3.16.1,<4",
  "django-cors-headers>=4.7,<5",
  "django-environ>=0.12,<1",
  "drf-spectacular[sidecar]>=0.28,<1",
  "tzdata>=2025.2",
  "httpx>=0.28,<1",
  "geographiclib>=2.1,<3",
  "timezonefinder>=8,<9",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-django>=4.11,<5"]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
